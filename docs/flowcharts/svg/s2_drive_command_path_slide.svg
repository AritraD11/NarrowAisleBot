<svg xmlns="http://www.w3.org/2000/svg" id="s2" class="fig big" viewBox="0 0 1760 990" width="1760" height="990" role="img" aria-label="Manual and autonomous commands merge at twist_mux and share one chain to the wheels; encoder feedback returns through the bridge to odometry"><title>Manual and autonomous commands merge at twist_mux and share one chain to the wheels; encoder feedback returns through the bridge to odometry</title><style>
svg text{font-family:"IBM Plex Sans","Segoe UI",Arial,Helvetica,sans-serif;fill:#172126}
.band{stroke-width:1.4}
.band-op{fill:#E9EEF1;stroke:#9AA7AE}
.band-pi{fill:#F3F6F4;stroke:#52606A}
.band-od{fill:#FBFBF7;stroke:#52606A;stroke-dasharray:8 6}
.band-hw{fill:#EDEFE9;stroke:#52606A}
.band-pl{fill:#F7F9F8;stroke:#52606A}
.bandlbl{font-weight:600;font-size:10.5px;fill:#52606A;letter-spacing:.08em}
.bandsub{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-weight:500;font-size:11px;letter-spacing:0;fill:#52606A}
.node rect{fill:#FFFFFF;stroke:#172126;stroke-width:1.2}
.node-ext rect{fill:#E9EEF1;stroke:#52606A}
.node.dashed rect{stroke-dasharray:4 3}
.node-hwn rect{fill:#E3E8E2;stroke:#172126;stroke-width:1.6}
.node-warnbox rect{fill:#FFFFFF;stroke:#C62828;stroke-width:1.4}
.node-callout rect{fill:#F7F9F8;stroke:#9AA7AE;stroke-dasharray:6 4}
.nt{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-weight:600;font-size:11px}
.node-grp .nt,.node-callout .nt{font-family:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
.ns{font-weight:400;font-size:10.5px;fill:#52606A}
.node-grp .ns{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-size:10px}
.note,.note-s{font-size:12px;fill:#52606A}.note-s{font-size:10.5px}
.e{fill:none;stroke-width:1.6;stroke-linejoin:round}
.e.thick{stroke-width:2.8}
.e.dash,.e-tf{stroke-dasharray:5 4}
.e-manual{stroke:#0072B2}.mk-manual{fill:#0072B2}
.e-auto{stroke:#C2410C}.mk-auto{fill:#C2410C}
.e-merge{stroke:#172126}.mk-merge{fill:#172126}
.e-fb{stroke:#00896A}.mk-fb{fill:#00896A}
.e-scan{stroke:#7C4DA8}.mk-scan{fill:#7C4DA8}
.e-ctl{stroke:#66737C}.mk-ctl{fill:#66737C}
.e-tf{stroke:#8A949B}.mk-tf{fill:#8A949B}
.e-warn{stroke:#C62828}.mk-warn{fill:#C62828}
.lb{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-weight:500;font-size:10px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.lb-manual{fill:#0072B2}.lb-auto{fill:#C2410C}.lb-merge{fill:#172126}.lb-fb{fill:#00896A}
.lb-scan{fill:#7C4DA8}.lb-ctl{fill:#66737C}.lb-tf{fill:#6A747B}.lb-warn{fill:#C62828}
/* slide scale */
.big .band{stroke-width:2}
.big .bandlbl{font-size:21px;letter-spacing:.05em}
.big .bandsub{font-size:21px}
.big .node rect{stroke-width:2.2}
.big .node-hwn rect{stroke-width:2.8}
.big .nt{font-size:24px}
.big .node-grp .nt,.big .node-callout .nt{font-size:26px}
.big .ns{font-size:21px}
.big .node-grp .ns{font-size:21px}
.big .note{font-size:21px}
.big .e{stroke-width:3.2}
.big .e.thick{stroke-width:5.5}
.big .lb{font-size:21px;stroke-width:6px}
.big .legtxt{font-size:21px}
.legtxt{font-size:12px}
</style><rect width="1760" height="990" fill="#FFFFFF"/><defs><marker id="a-s2-manual" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-manual"/></marker><marker id="a-s2-auto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-auto"/></marker><marker id="a-s2-merge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-merge"/></marker><marker id="a-s2-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-fb"/></marker><marker id="a-s2-scan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-scan"/></marker><marker id="a-s2-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-ctl"/></marker><marker id="a-s2-tf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-tf"/></marker><marker id="a-s2-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-warn"/></marker></defs><path class="e e-manual" data-c="manual" d="M285,73 L640,73" marker-end="url(#a-s2-manual)"/><path class="e e-auto" data-c="auto" d="M105,339 L105,410" marker-end="url(#a-s2-auto)"/><path class="e e-auto" data-c="auto" d="M105,514 L105,585" marker-end="url(#a-s2-auto)"/><path class="e e-auto" data-c="auto" d="M105,689 L105,760" marker-end="url(#a-s2-auto)"/><path class="e e-auto" data-c="auto" d="M375,800 L400,800 L400,117 L640,117" marker-end="url(#a-s2-auto)"/><path class="e e-merge thick" data-c="merge" d="M700,139 L700,235" marker-end="url(#a-s2-merge)"/><path class="e e-merge thick" data-c="merge" d="M700,339 L700,435" marker-end="url(#a-s2-merge)"/><path class="e e-merge thick" data-c="merge" d="M700,539 L700,635" marker-end="url(#a-s2-merge)"/><path class="e e-merge thick" data-c="merge" d="M700,739 L700,835" marker-end="url(#a-s2-merge)"/><path class="e e-fb" data-c="fb" d="M925,835 L925,739" marker-end="url(#a-s2-fb)"/><path class="e e-fb" data-c="fb" d="M925,635 L925,539" marker-end="url(#a-s2-fb)"/><path class="e e-fb" data-c="fb" d="M980,495 L1290,495" marker-end="url(#a-s2-fb)"/><path class="e e-fb" data-c="fb" d="M1490,435 L1490,313" marker-end="url(#a-s2-fb)"/><g class="node node-ext"><rect x="35" y="35" width="250" height="78" rx="4"/><text class="nt" x="51" y="69">Phone or gamepad</text><text class="ns" x="51" y="99">REP-103 axes</text></g><g class="node node-ros"><rect x="35" y="235" width="340" height="104" rx="4"/><text class="nt" x="51" y="269">controller_server</text><text class="ns" x="51" y="299">MPPI, plus behavior_server</text><text class="ns" x="51" y="325">BackUp, Spin use it too</text></g><g class="node node-ros"><rect x="35" y="410" width="340" height="104" rx="4"/><text class="nt" x="51" y="444">velocity_smoother</text><text class="ns" x="51" y="474">accel 0.3, decel 0.5</text><text class="ns" x="51" y="500">stops after 1 s idle</text></g><g class="node node-ros"><rect x="35" y="585" width="340" height="104" rx="4"/><text class="nt" x="51" y="619">collision_monitor</text><text class="ns" x="51" y="649">footprint polygon,</text><text class="ns" x="51" y="675">reads live scan only</text></g><g class="node node-ros"><rect x="35" y="760" width="340" height="78" rx="4"/><text class="nt" x="51" y="794">cmd_vel_axis_adapter</text><text class="ns" x="51" y="824">base_link axes to wheel axes</text></g><g class="node node-ros"><rect x="640" y="35" width="340" height="104" rx="4"/><text class="nt" x="656" y="69">twist_mux</text><text class="ns" x="656" y="99">manual 100, nav 10</text><text class="ns" x="656" y="125">0.5 s timeout each</text></g><g class="node node-ros"><rect x="640" y="235" width="340" height="104" rx="4"/><text class="nt" x="656" y="269">teleop_asym</text><text class="ns" x="656" y="299">inverse kinematics,</text><text class="ns" x="656" y="325">clamp 6.28 rad/s</text></g><g class="node node-ros"><rect x="640" y="435" width="340" height="104" rx="4"/><text class="nt" x="656" y="469">esp32_bridge</text><text class="ns" x="656" y="499">0.5 s silence sends</text><text class="ns" x="656" y="525">zero speeds</text></g><g class="node node-hwn"><rect x="640" y="635" width="340" height="104" rx="4"/><text class="nt" x="656" y="669">ESP32</text><text class="ns" x="656" y="699">100 Hz PID,</text><text class="ns" x="656" y="725">750 ms watchdog</text></g><g class="node node-hwn"><rect x="640" y="835" width="340" height="100" rx="4"/><text class="nt" x="656" y="869">4 wheels</text><text class="ns" x="656" y="899">encoders</text></g><g class="node node-ros"><rect x="1290" y="435" width="400" height="104" rx="4"/><text class="nt" x="1306" y="469">odometry_publisher</text><text class="ns" x="1306" y="499">forward kinematics,</text><text class="ns" x="1306" y="525">lateral scale 0.92</text></g><g class="node node-ros"><rect x="1290" y="235" width="400" height="78" rx="4"/><text class="nt" x="1306" y="269">/wheel_odom + TF</text><text class="ns" x="1306" y="299">read by Nav2, slam_toolbox</text></g><g class="node node-callout"><rect x="1290" y="640" width="430" height="156" rx="4"/><text class="nt" x="1306" y="674">Four watchdogs, outermost first</text><text class="ns" x="1306" y="704">twist_mux: 0.5 s per source</text><text class="ns" x="1306" y="730">esp32_bridge: 0.5 s, zero speeds</text><text class="ns" x="1306" y="756">ESP32: 750 ms, ramps to stop</text><text class="ns" x="1306" y="782">velocity_smoother: 1 s</text></g><text class="lb lb-manual" data-c="manual" x="442" y="61" text-anchor="middle">/cmd_vel_manual</text><text class="lb lb-auto" data-c="auto" x="119" y="395" text-anchor="start">/cmd_vel_nav</text><text class="lb lb-auto" data-c="auto" x="119" y="570" text-anchor="start">/cmd_vel_smoothed</text><text class="lb lb-auto" data-c="auto" x="119" y="745" text-anchor="start">/cmd_vel_baselink</text><text class="lb lb-auto" data-c="auto" x="416" y="786" text-anchor="start">/cmd_vel_nav_out</text><text class="lb lb-merge" data-c="merge" x="716" y="215" text-anchor="start">/cmd_vel</text><text class="lb lb-merge" data-c="merge" x="716" y="415" text-anchor="start">/wheel_speeds</text><text class="lb lb-merge" data-c="merge" x="716" y="615" text-anchor="start">&lt;V,fr,fl,rr,rl&gt;</text><text class="lb lb-merge" data-c="merge" x="716" y="815" text-anchor="start">PWM + DIR</text><text class="lb lb-fb" data-c="fb" x="939" y="815" text-anchor="start">encoders</text><text class="lb lb-fb" data-c="fb" x="939" y="615" text-anchor="start">&lt;L1&gt; 20 Hz</text><text class="lb lb-fb" data-c="fb" x="1135.0" y="481" text-anchor="middle">/wheel_velocities_actual</text><text class="lb lb-fb" data-c="fb" x="1504" y="385" text-anchor="start">publishes</text><text class="note" x="1290" y="905" text-anchor="start">Manual wins while it publishes,</text><text class="note" x="1290" y="932" text-anchor="start">and loses 0.5 s after the last message.</text></svg>