<svg xmlns="http://www.w3.org/2000/svg" id="s1" class="fig big" viewBox="0 0 1760 990" width="1760" height="990" role="img" aria-label="System at a glance: operator interface, drive chain, odometry, arm, mapping and navigation on the Pi, and the ESP32 and Mega that drive the hardware"><title>System at a glance: operator interface, drive chain, odometry, arm, mapping and navigation on the Pi, and the ESP32 and Mega that drive the hardware</title><style>
