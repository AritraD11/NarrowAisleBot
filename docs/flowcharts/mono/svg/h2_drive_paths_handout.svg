<svg xmlns="http://www.w3.org/2000/svg" id="h2" class="fig small" viewBox="0 0 1320 470" width="1320" height="470" role="img" aria-label="Both drive paths merge at twist_mux and share one chain to the wheels, while encoder feedback returns through the bridge to odometry"><title>Both drive paths merge at twist_mux and share one chain to the wheels, while encoder feedback returns through the bridge to odometry</title><style>
svg text{font-family:"IBM Plex Sans","Segoe UI",Arial,Helvetica,sans-serif;fill:#111111}
.band{stroke-width:1.4}
.band-op{fill:#F2F2F2;stroke:#8C8C8C}
.band-pi{fill:#FFFFFF;stroke:#444444}
.band-od{fill:#FFFFFF;stroke:#444444;stroke-dasharray:8 6}
.band-hw{fill:#FFFFFF;stroke:#444444}
.band-pl{fill:#FFFFFF;stroke:#444444}
.bandlbl{font-weight:600;font-size:10.5px;fill:#444444;letter-spacing:.08em}
.bandsub{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-weight:500;font-size:11px;letter-spacing:0;fill:#444444}
.node rect{fill:#FFFFFF;stroke:#111111;stroke-width:1.2}
.node-ext rect{fill:#F2F2F2;stroke:#444444}
.node.dashed rect{stroke-dasharray:4 3}
.node-hwn rect{fill:#E6E6E6;stroke:#111111;stroke-width:1.6}
.node-warnbox rect{fill:#FFFFFF;stroke:#1A1A1A;stroke-width:1.4}
.node-callout rect{fill:#FFFFFF;stroke:#8C8C8C;stroke-dasharray:6 4}
.nt{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-weight:600;font-size:11px}
.node-grp .nt,.node-callout .nt{font-family:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
.ns{font-weight:400;font-size:10.5px;fill:#444444}
.node-grp .ns{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-size:10px}
.note,.note-s{font-size:12px;fill:#444444}.note-s{font-size:10.5px}
.e{fill:none;stroke-width:1.6;stroke-linejoin:round}
.e.thick{stroke-width:2.8}
.e.dash,.e-tf{stroke-dasharray:5 4}
.e-manual{stroke:#1A1A1A}.mk-manual{fill:#1A1A1A}
.e-auto{stroke:#1A1A1A}.mk-auto{fill:#1A1A1A}
.e-merge{stroke:#111111}.mk-merge{fill:#111111}
.e-fb{stroke:#1A1A1A}.mk-fb{fill:#1A1A1A}
.e-scan{stroke:#1A1A1A}.mk-scan{fill:#1A1A1A}
.e-ctl{stroke:#4D4D4D}.mk-ctl{fill:#4D4D4D}
.e-tf{stroke:#6E6E6E}.mk-tf{fill:#6E6E6E}
.e-warn{stroke:#1A1A1A}.mk-warn{fill:#1A1A1A}
.lb{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-weight:500;font-size:10px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.lb-manual{fill:#1A1A1A}.lb-auto{fill:#1A1A1A}.lb-merge{fill:#111111}.lb-fb{fill:#1A1A1A}
.lb-scan{fill:#1A1A1A}.lb-ctl{fill:#4D4D4D}.lb-tf{fill:#555555}.lb-warn{fill:#1A1A1A}
/* slide scale */
.big .band{stroke-width:2}
.big .bandlbl{font-size:21px;letter-spacing:.05em}
.big .bandsub{font-size:21px}
.big .node rect{stroke-width:2.2}
.big .node-hwn rect{stroke-width:2.8}
.big .nt{font-size:24px}
.big .node-grp .nt,.big .node-callout .nt{font-size:26px}
.big .ns{font-size:21px}
.big .node-grp .ns{font-size:21px}
.big .note{font-size:21px}
.big .e{stroke-width:3.2}
.big .e.thick{stroke-width:5.5}
.big .lb{font-size:21px;stroke-width:6px}
.big .legtxt{font-size:21px}
.legtxt{font-size:12px}
.leg{display:none}</style><rect width="1320" height="470" fill="#FFFFFF"/><defs><marker id="a-h2-manual" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-manual"/></marker><marker id="a-h2-auto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-auto"/></marker><marker id="a-h2-merge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-merge"/></marker><marker id="a-h2-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-fb"/></marker><marker id="a-h2-scan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-scan"/></marker><marker id="a-h2-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-ctl"/></marker><marker id="a-h2-tf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-tf"/></marker><marker id="a-h2-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-warn"/></marker></defs><path class="e e-manual" data-c="manual" d="M190,68 L620,68" marker-end="url(#a-h2-manual)"/><path class="e e-auto" data-c="auto" d="M170,178 L260,178" marker-end="url(#a-h2-auto)"/><path class="e e-auto" data-c="auto" d="M390,178 L470,178" marker-end="url(#a-h2-auto)"/><path class="e e-auto" data-c="auto" d="M600,178 L670,178" marker-end="url(#a-h2-auto)"/><path class="e e-auto" data-c="auto" d="M700,150 L700,96" marker-end="url(#a-h2-auto)"/><path class="e e-merge thick" data-c="merge" d="M750,68 L840,68" marker-end="url(#a-h2-merge)"/><path class="e e-merge thick" data-c="merge" d="M950,68 L1040,68" marker-end="url(#a-h2-merge)"/><path class="e e-merge thick" data-c="merge" d="M1150,68 L1190,68" marker-end="url(#a-h2-merge)"/><path class="e e-merge thick" data-c="merge" d="M1240,96 L1240,150" marker-end="url(#a-h2-merge)"/><path class="e e-fb" data-c="fb" d="M1240,206 L1240,280" marker-end="url(#a-h2-fb)"/><path class="e e-fb" data-c="fb" d="M1190,308 L1150,308" marker-end="url(#a-h2-fb)"/><path class="e e-fb" data-c="fb" d="M1040,308 L920,308" marker-end="url(#a-h2-fb)"/><path class="e e-fb" data-c="fb" d="M770,308 L710,308" marker-end="url(#a-h2-fb)"/><path class="e e-fb" data-c="fb" d="M520,308 L470,308" marker-end="url(#a-h2-fb)"/><path class="e e-tf dash" data-c="tf" d="M330,280 L330,206" marker-end="url(#a-h2-tf)"/><g class="node node-ext"><rect x="20" y="40" width="170" height="56" rx="4"/><text class="nt" x="29" y="57">Phone, gamepad, keys</text><text class="ns" x="29" y="71.0">REP-103 axes</text></g><g class="node node-ros"><rect x="620" y="40" width="130" height="56" rx="4"/><text class="nt" x="629" y="57">twist_mux</text><text class="ns" x="629" y="71.0">manual 100, nav 10</text><text class="ns" x="629" y="83.5">0.5 s timeout each</text></g><g class="node node-ros"><rect x="840" y="40" width="110" height="56" rx="4"/><text class="nt" x="849" y="57">teleop_asym</text><text class="ns" x="849" y="71.0">clamp 6.28 rad/s</text></g><g class="node node-ros"><rect x="1040" y="40" width="110" height="56" rx="4"/><text class="nt" x="1049" y="57">esp32_bridge</text><text class="ns" x="1049" y="71.0">0.5 s no input,</text><text class="ns" x="1049" y="83.5">sends zero speed</text></g><g class="node node-hwn"><rect x="1190" y="40" width="100" height="56" rx="4"/><text class="nt" x="1199" y="57">ESP32</text><text class="ns" x="1199" y="71.0">750 ms, ramps</text><text class="ns" x="1199" y="83.5">to stop</text></g><g class="node node-ros"><rect x="20" y="150" width="150" height="56" rx="4"/><text class="nt" x="29" y="167">controller_server</text><text class="ns" x="29" y="181.0">MPPI, plus behavior</text><text class="ns" x="29" y="193.5">server, same path</text></g><g class="node node-ros"><rect x="260" y="150" width="130" height="56" rx="4"/><text class="nt" x="269" y="167">velocity_smoother</text><text class="ns" x="269" y="181.0">accel 0.3, decel 0.5</text><text class="ns" x="269" y="193.5">stops after 1 s</text></g><g class="node node-ros"><rect x="470" y="150" width="130" height="56" rx="4"/><text class="nt" x="479" y="167">collision_monitor</text><text class="ns" x="479" y="181.0">footprint polygon</text><text class="ns" x="479" y="193.5">live scan only</text></g><g class="node node-ros"><rect x="670" y="150" width="140" height="56" rx="4"/><text class="nt" x="679" y="167">axis_adapter</text><text class="ns" x="679" y="181.0">base_link axes to</text><text class="ns" x="679" y="193.5">wheel axes</text></g><g class="node node-hwn"><rect x="1190" y="150" width="100" height="56" rx="4"/><text class="nt" x="1199" y="167">Wheels</text><text class="ns" x="1199" y="181.0">4 encoders</text></g><g class="node node-hwn"><rect x="1190" y="280" width="100" height="56" rx="4"/><text class="nt" x="1199" y="297">ESP32</text><text class="ns" x="1199" y="311.0">EMA alpha 0.4</text></g><g class="node node-ros"><rect x="1040" y="280" width="110" height="56" rx="4"/><text class="nt" x="1049" y="297">esp32_bridge</text><text class="ns" x="1049" y="311.0">parses &lt;L1&gt;</text></g><g class="node node-ros"><rect x="770" y="280" width="150" height="56" rx="4"/><text class="nt" x="779" y="297">odometry_publisher</text><text class="ns" x="779" y="311.0">dt = Pi arrival time</text></g><g class="node node-ros"><rect x="520" y="280" width="190" height="56" rx="4"/><text class="nt" x="529" y="297">/wheel_odom + TF</text><text class="ns" x="529" y="311.0">odom &gt; base_link</text><text class="ns" x="529" y="323.5">rotated -90 deg, +Y fwd</text></g><g class="node node-ros"><rect x="250" y="280" width="220" height="56" rx="4"/><text class="nt" x="259" y="297">Nav2, slam_toolbox</text><text class="ns" x="259" y="311.0">pose is wheel odometry,</text><text class="ns" x="259" y="323.5">scan matching is off</text></g><text class="lb lb-manual" data-c="manual" x="405" y="62" text-anchor="middle">/cmd_vel_manual</text><text class="lb lb-auto" data-c="auto" x="215" y="172" text-anchor="middle">/cmd_vel_nav</text><text class="lb lb-auto" data-c="auto" x="430" y="172" text-anchor="middle">smoothed</text><text class="lb lb-auto" data-c="auto" x="635" y="172" text-anchor="middle">baselink</text><text class="lb lb-auto" data-c="auto" x="708" y="126" text-anchor="start">/cmd_vel_nav_out</text><text class="lb lb-merge" data-c="merge" x="795" y="62" text-anchor="middle">/cmd_vel</text><text class="lb lb-merge" data-c="merge" x="995" y="62" text-anchor="middle">/wheel_speeds</text><text class="lb lb-merge" data-c="merge" x="1232" y="128" text-anchor="end">PWM</text><text class="lb lb-fb" data-c="fb" x="1232" y="248" text-anchor="end">100 Hz PCNT</text><text class="lb lb-fb" data-c="fb" x="1170" y="302" text-anchor="middle">&lt;L1&gt;</text><text class="lb lb-fb" data-c="fb" x="980" y="298" text-anchor="middle">/wheel_velocities_</text><text class="lb lb-fb" data-c="fb" x="980" y="324" text-anchor="middle">actual</text><text class="lb lb-tf" data-c="tf" x="338" y="248" text-anchor="start">pose</text><text class="note" x="20" y="390" text-anchor="start">Manual wins while it publishes and loses 0.5 s after the last message.</text><text class="note" x="20" y="410" text-anchor="start">Four watchdogs stack: twist_mux 0.5 s, bridge 0.5 s, ESP32 750 ms, velocity_smoother 1 s.</text><text class="note" x="20" y="430" text-anchor="start">Dashboard E-STOP: zero the drive, send &lt;S&gt; to the ESP32 (latched), ESTOP the arm, stop mapping.</text></svg>