# Example: a 4WD skid-steer base on an Arduino Mega, BTS7960 drivers (dual_pwm),
# interrupt encoders at x2 decoding, RPLIDAR mounted facing backwards.
# Illustrative values, not a robot we have built. Regenerated by hand from
# robot_config.yaml; comments there explain every key.
robot:
  name: skidbot
  drive_type: skid_steer
  wheel_radius: 0.0625
  track_width: 0.42
  wheelbase: 0.3
  track_width_scale: 1.0
  lateral_scale: 1.0
  body:
    length: 0.55
    width: 0.5
    height: 0.25
    center_x: 0.0
    footprint_margin: 0.03
wheels:
- name: front_left
  x: auto
  y: auto
  counts_per_rev: auto
  encoder_ppr: 7
  encoder_decoding: 2
  gear_ratio: 51.0
  motor_dir: 1
  encoder_dir: 1
  pins:
    pwm_fwd: 2
    pwm_rev: 3
    enc_a: 18
    enc_b: 22
- name: front_right
  x: auto
  y: auto
  counts_per_rev: auto
  encoder_ppr: 7
  encoder_decoding: 2
  gear_ratio: 51.0
  motor_dir: -1
  encoder_dir: -1
  pins:
    pwm_fwd: 4
    pwm_rev: 5
    enc_a: 19
    enc_b: 23
- name: rear_left
  x: auto
  y: auto
  counts_per_rev: auto
  encoder_ppr: 7
  encoder_decoding: 2
  gear_ratio: 51.0
  motor_dir: 1
  encoder_dir: 1
  pins:
    pwm_fwd: 6
    pwm_rev: 7
    enc_a: 20
    enc_b: 24
- name: rear_right
  x: auto
  y: auto
  counts_per_rev: auto
  encoder_ppr: 7
  encoder_decoding: 2
  gear_ratio: 51.0
  motor_dir: -1
  encoder_dir: -1
  pins:
    pwm_fwd: 8
    pwm_rev: 9
    enc_a: 21
    enc_b: 25
driver:
  type: dual_pwm
mcu:
  board: avr
  encoder_backend: isr
  baud: 115200
  device_name: robot_mcu
  usb_vendor_id: '2341'
  usb_product_id: '0042'
  usb_serial: ''
  usb_port_path: ''
  control_hz: 50
  telemetry_hz: 10
  watchdog_ms: 750
  max_wheel_speed: 8.0
  max_wheel_accel: 20.0
  pwm_bits: 8
  pwm_freq_hz: 20000
  min_pwm_out: 0
  pid:
    kp: 10.0
    ki: 50.0
    kd: 0.0
  kff:
  - 0.0
  - 0.0
  - 0.0
  - 0.0
  kstat:
  - 0.0
  - 0.0
  - 0.0
  - 0.0
lidar:
  model: rplidar
  device_name: lidar
  usb_vendor_id: 10c4
  usb_product_id: ea60
  usb_serial: ''
  usb_port_path: ''
  baud: 115200
  frame_id: laser_frame
  mount:
    x: 0.15
    y: 0.0
    z: 0.3
    yaw_deg: 180.0
  mirror: false
  mask_deg: []
  range_min: 0.1
  range_max: 10.0
  driver_overrides: {}
  custom:
    package: ''
    executable: ''
    params_file: ''
teleop:
  max_linear: 0.3
  max_angular: 0.8
dashboard:
  port: 8080
  log_dir: ~/robot_logs
slam:
  resolution: 0.05
  max_laser_range: 6.0
  use_scan_matching: true
  minimum_travel_distance: 0.2
  minimum_travel_heading: 0.2
nav:
  controller: auto
  max_vx: 0.25
  min_vx: -0.1
  max_vy: 0.15
  max_wz: 0.8
  accel:
  - 0.3
  - 0.3
  - 0.8
  decel:
  - -0.5
  - -0.5
  - -1.0
  inflation_radius: auto
  goal_xy_tolerance: 0.1
  goal_yaw_tolerance: 0.15
  controller_hz: 10.0
system:
  workspace: ~/ros2_ws
  ros_domain_id: 42
  autostart: true
  wifi_ap:
    enable: false
    ssid: MyRobot-Pi
    password: change-me-please
    country: IN
