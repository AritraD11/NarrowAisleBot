</style><rect width="1760" height="990" fill="#FFFFFF"/><defs><marker id="a-s4-manual" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-manual"/></marker><marker id="a-s4-auto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-auto"/></marker><marker id="a-s4-merge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-merge"/></marker><marker id="a-s4-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-fb"/></marker><marker id="a-s4-scan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-scan"/></marker><marker id="a-s4-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-ctl"/></marker><marker id="a-s4-tf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-tf"/></marker><marker id="a-s4-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-warn"/></marker></defs><rect class="band band-pl" x="1150" y="20" width="590" height="560" rx="6"/><text class="bandlbl" x="1164" y="47">TF TREE</text><path class="e e-scan" data-c="scan" d="M115,113 L115,235" marker-end="url(#a-s4-scan)"/><path class="e e-scan" data-c="scan" d="M115,339 L115,435" marker-end="url(#a-s4-scan)"/><path class="e e-scan" data-c="scan" d="M115,539 L115,635" marker-end="url(#a-s4-scan)"/><path class="e e-scan" data-c="scan" d="M115,739 L115,835" marker-end="url(#a-s4-scan)"/><path class="e e-ctl dash" data-c="ctl" d="M375,490 L640,490" marker-end="url(#a-s4-ctl)"/><path class="e e-fb" data-c="fb" d="M640,690 L375,690" marker-end="url(#a-s4-fb)"/><path class="e e-tf" data-c="tf" d="M1305,150 L1305,215" marker-end="url(#a-s4-tf)"/><path class="e e-tf" data-c="tf" d="M1305,285 L1305,350" marker-end="url(#a-s4-tf)"/><path class="e e-tf" data-c="tf" d="M1305,420 L1305,485" marker-end="url(#a-s4-tf)"/><g class="node node-hwn"><rect x="35" y="35" width="340" height="78" rx="4"/><text class="nt" x="51" y="69">YDLIDAR X4 Pro</text><text class="ns" x="51" y="99">USB, 128000 baud</text></g><g class="node node-ros"><rect x="35" y="235" width="340" height="104" rx="4"/><text class="nt" x="51" y="269">ydlidar driver</text><text class="ns" x="51" y="299">lifecycle node</text><text class="ns" x="51" y="325">11.4 Hz measured</text></g><g class="node node-ros"><rect x="35" y="435" width="340" height="104" rx="4"/><text class="nt" x="51" y="469">scan_relay</text><text class="ns" x="51" y="499">mirror, rear mask,</text><text class="ns" x="51" y="525">republish RELIABLE</text></g><g class="node node-ros"><rect x="35" y="635" width="340" height="104" rx="4"/><text class="nt" x="51" y="669">slam_toolbox</text><text class="ns" x="51" y="699">async mapping,</text><text class="ns" x="51" y="725">scan matching off</text></g><g class="node node-grp"><rect x="35" y="835" width="340" height="104" rx="4"/><text class="nt" x="51" y="869">Map consumers</text><text class="ns" x="51" y="899">phone_dashboard,</text><text class="ns" x="51" y="925">Nav2 global costmap</text></g><g class="node node-callout"><rect x="640" y="400" width="480" height="156" rx="4"/><text class="nt" x="656" y="434">What scan_relay does, in order</text><text class="ns" x="656" y="464">1  undo the mirrored bearing</text><text class="ns" x="656" y="490">2  blank the rear mast arc, 107 beams</text><text class="ns" x="656" y="516">3  optional range window</text><text class="ns" x="656" y="542">4  optional K-of-N persistence gate</text></g><g class="node node-ros"><rect x="640" y="635" width="400" height="104" rx="4"/><text class="nt" x="656" y="669">odometry_publisher</text><text class="ns" x="656" y="699">wheel velocities in,</text><text class="ns" x="656" y="725">odom to base_link out</text></g><g class="node node-ros"><rect x="1190" y="80" width="230" height="70" rx="4"/><text class="nt" x="1206" y="114">map</text></g><g class="node node-ros"><rect x="1190" y="215" width="230" height="70" rx="4"/><text class="nt" x="1206" y="249">odom</text></g><g class="node node-ros"><rect x="1190" y="350" width="230" height="70" rx="4"/><text class="nt" x="1206" y="384">base_link</text></g><g class="node node-ros"><rect x="1190" y="485" width="230" height="70" rx="4"/><text class="nt" x="1206" y="519">laser_frame</text></g><text class="lb lb-scan" data-c="scan" x="129" y="215" text-anchor="start">USB serial</text><text class="lb lb-scan" data-c="scan" x="129" y="415" text-anchor="start">/scan BEST_EFFORT</text><text class="lb lb-scan" data-c="scan" x="129" y="615" text-anchor="start">/scan_reliable</text><text class="lb lb-scan" data-c="scan" x="129" y="815" text-anchor="start">/map</text><text class="lb lb-fb" data-c="fb" x="507.5" y="673" text-anchor="middle">TF odom &gt; base_link</text><text class="lb lb-tf" data-c="tf" x="1321" y="192" text-anchor="start">slam_toolbox</text><text class="lb lb-tf" data-c="tf" x="1321" y="327" text-anchor="start">odometry_publisher</text><text class="lb lb-tf" data-c="tf" x="1321" y="462" text-anchor="start">robot_state_publisher</text><text class="note" x="1164" y="640" text-anchor="start">laser_frame sits at (0, 0.27, 0.275) from base_link.</text><text class="note" x="1164" y="670" text-anchor="start">Wheel frames are not published, nothing sends joint_states.</text><text class="note" x="1164" y="700" text-anchor="start">Pose is wheel odometry only: no IMU, scan matching off.</text></svg>