# ==============================================================
# AisleBot Nav2 Configuration
# Tuned for omnidirectional mecanum with narrow-aisle constraints
#
# Theory and parameter reasoning: docs/Navigation_Theory.md
#
# ⚠ FOOTPRINT NEEDS A TAPE MEASURE BEFORE FIRST AUTONOMOUS RUN.
#   See the footprint comment in local_costmap below. The value here is
#   derived from aislebot.urdf's chassis box (1.0 x 0.50 m) plus a 6 cm
#   margin. It has NOT been verified against the physical robot, and the
#   URDF and the user's own measurement currently disagree about width.
#   A footprint smaller than the real robot means confident collisions.
#
# ⚠ AMCL vs SLAM: do NOT run amcl and slam_toolbox at the same time.
#   Both publish the map->odom transform; running both corrupts the pose
#   estimate (Navigation_Theory.md §5). The amcl block below is for the
#   FUTURE "navigate on a previously-saved map" mode only. While
#   slam_toolbox is mapping, amcl must stay unlaunched.
#
# ⚠ AXES: base_link is NOT standard REP-103 on this robot. +X = right,
#   +Y = forward (odometry_publisher.py publishes a constant -90 deg
#   rotation to match the LiDAR's validated calibration rather than the
#   textbook convention — Research_Journal.md §17.10). Every x/y-labelled
#   parameter below (footprint, DWB velocity limits, sample counts) is
#   swapped from what a stock Nav2 config would have, on purpose. If this
#   axis convention is ever changed back, every one of these needs
#   re-swapping too, not just the odometry node.
# ==============================================================

amcl:
  ros__parameters:
    alpha1: 0.2          # rotation noise from rotation
    alpha2: 0.2          # rotation noise from translation
    alpha3: 0.2          # translation noise from translation
    alpha4: 0.2          # translation noise from rotation
    alpha5: 0.1          # strafe noise
    base_frame_id: "base_link"
    global_frame_id: "map"
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    robot_model_type: "omnidirectional"    # Mecanum = omnidirectional
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
    tf_broadcast: true
    transform_tolerance: 1.0
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    update_min_a: 0.1
    update_min_d: 0.15

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    # /odometry/filtered is the robot_localization EKF output — that node is
    # Phase 2 work and is NOT running. odometry_publisher publishes /wheel_odom
    # (aislebot_full.launch.py). Pointing at the EKF topic means bt_navigator
    # waits forever for odometry that never arrives. Switch back to
    # /odometry/filtered if and when the EKF is actually brought up.
    odom_topic: /wheel_odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 5
    # Default BT — navigates, recovers, replans
    default_nav_to_pose_bt_xml: ""
    # plugin_lib_names DELIBERATELY NOT SET. Nav2 ships a comprehensive
    # default list, and setting this key REPLACES that list rather than
    # adding to it — so a hand-written subset means every BT node not in
    # the subset fails to load. The default behaviour tree
    # (navigate_to_pose_w_replanning_and_recovery.xml, used because
    # default_nav_to_pose_bt_xml is "") references a good deal more than
    # the 13 entries that used to be listed here — speed controller,
    # truncate path, goal updater, remove-passed-goals, the selector and
    # error-code nodes — so bt_navigator would have failed at load with
    # "Node not recognized" on the first goal. Never exercised before
    # because Nav2 has never run on this robot (§17.6's four-bug pass
    # found the same class of latent config error).
    # Re-add this key ONLY to register genuinely custom BT plugins, and
    # then it must repeat Nav2's full default list as well.

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001     # Enable lateral motion
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05           # 5cm tolerance (tight for narrow aisle)
      yaw_goal_tolerance: 0.05          # ~3 degrees
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      # x = strafe axis, y = forward/reverse axis on this robot (see the
      # AXES note at the top of this file) — swapped from a stock config.
      min_vel_x: -0.10                   # Can strafe the other way (mecanum!)
      min_vel_y: -0.10                   # Can reverse
      max_vel_x: 0.15                    # Full strafe capability
      max_vel_y: 0.15                    # Conservative for narrow aisles
      max_vel_theta: 0.30
      min_speed_xy: 0.0
      max_speed_xy: 0.20
      min_speed_theta: 0.0
      acc_lim_x: 0.5                     # Mecanum can accelerate laterally
      acc_lim_y: 0.5
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -1.0
      vx_samples: 5                      # Sample lateral (strafe) velocities
      vy_samples: 10                     # Finer sampling on forward/reverse
      vtheta_samples: 20
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      short_circuit_trajectory_evaluation: true
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.25
      critics:
        - RotateToGoal
        - Oscillation
        - ObstacleFootprint
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      # MUST be true while mapping an unknown space with slam_toolbox. With
      # false, the planner refuses to route through unknown cells — and the
      # placement-trial maps were ~85% unknown (§17.4), so essentially no goal
      # would ever be reachable. Safety comes from the local costmap + footprint
      # check, not from refusing to enter unmapped space
      # (Navigation_Theory.md §2). Set false only when navigating a complete,
      # previously-saved map.
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # ── FOOTPRINT ────────────────────────────────────────────────────
      # Rectangle in base_link, [x, y] corners, metres. base_link sits at the
      # chassis centre. On this robot x = width axis, y = length/forward
      # axis (see the AXES note at the top of this file) — so a robot of
      # length l and width w spans x = ±w/2, y = ±l/2 (swapped from what a
      # stock REP-103 config would write here).
      #
      # TAPE-MEASURED 8 Aug 2026 (§17.7):
      #   width  = 36 cm wheel-outer to wheel-outer (the widest part)
      #   length = 100 cm
      #   + 6 cm clearance margin all round -> 0.48 m wide x 1.12 m long
      #   -> x (width) = ±0.24, y (length) = ±0.56
      #
      # NOTE: aislebot.urdf models the chassis box as 0.50 m wide, which the
      # measurement contradicts — the real robot is 36 cm across. The URDF's
      # WHEEL joint origins (±0.15769 ± 0.03 half-width = 0.375 m outer) do
      # agree with the tape to within a centimetre, so it is specifically the
      # chassis <box> that is wrong, not the kinematic parameters (which are
      # what the PID/odometry actually depend on — those are unaffected).
      # URDF box corrected to match; see the comment there.
      footprint: "[[0.24, 0.56], [0.24, -0.56], [-0.24, -0.56], [-0.24, 0.56]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          # /scan is published BEST-EFFORT by the ydlidar driver; costmap
          # subscribes reliable by default. That is exactly the QoS mismatch
          # that made slam_toolbox hang forever on "Waiting for laser_scans"
          # (§13.4) — same trap, same silent failure mode, different consumer.
          # Use the relay's reliable republication, as everything else does.
          topic: /scan_reliable
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          # YDLIDAR X4 Pro is spec'd 0.12–10 m (80% reflectivity). The old 12.0
          # exceeded the hardware maximum. Kept slightly under 10 m because the
          # rated range degrades on dark/matte surfaces, which is most of a real
          # warehouse.
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        # Must be >= the footprint's inscribed radius (half-width = 0.24 m) or
        # poses that are certainly in collision get non-lethal cost. But too
        # large closes narrow aisles entirely — inflation from both walls meets
        # in the middle and the planner sees no corridor (Navigation_Theory.md
        # §1.1). Tune against the narrowest aisle that must be traversable.
        inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      # Keep identical to local_costmap's footprint — see the full note there.
      footprint: "[[0.24, 0.56], [0.24, -0.56], [-0.24, -0.56], [-0.24, 0.56]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_reliable      # QoS — see local_costmap note
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 9.0
          raytrace_min_range: 0.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.45

map_server:
  ros__parameters:
    yaml_filename: ""
    topic_name: "map"
    frame_id: "map"

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200   # ms

# ==============================================================
# VELOCITY SMOOTHER
#
# Last stage of the Nav2 cmd_vel chain, and easy to miss:
#   controller_server -> /cmd_vel_nav -> velocity_smoother -> /cmd_vel
# /cmd_vel is what teleop_asym consumes, so EVERY autonomous command
# passes through here. Nav2's navigation_launch.py starts this node
# whether or not this block exists.
#
# ⚠ THIS BLOCK IS NOT OPTIONAL ON THIS ROBOT. Nav2's stock defaults are
#   written for a differential-drive base and set the y limits to 0.0 —
#   "this robot cannot move sideways." On a standard robot that is
#   correct and harmless. Here, +Y IS FORWARD (see the AXES note at the
#   top of this file), so inheriting those defaults would clamp all
#   forward and reverse motion to zero and the robot would refuse to
#   drive anywhere, while the planner happily produced paths and the
#   controller happily published velocities into a silent wall.
#
# Arrays are [x, y, theta] = [strafe, forward/reverse, yaw] on this
# robot. Values match the DWB limits in controller_server above; keep
# the two in step if either is retuned.
# ==============================================================
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"          # CLOSED_LOOP reads odom to estimate the
                                   # current velocity; OPEN_LOOP integrates
                                   # its own last command. Open-loop first —
                                   # one less coupling while proving the
                                   # chain end-to-end.
    max_velocity: [0.15, 0.15, 0.30]
    min_velocity: [-0.10, -0.10, -0.30]
    max_accel: [0.5, 0.5, 1.0]
    max_decel: [-0.5, -0.5, -1.0]
    odom_topic: "/wheel_odom"      # odometry_publisher's topic, same as
                                   # bt_navigator. NOT /odometry/filtered —
                                   # that EKF has never run (§17.6).
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0          # stop if no command for 1 s — the
                                   # dead-man for a planner that stops
                                   # publishing mid-drive.
