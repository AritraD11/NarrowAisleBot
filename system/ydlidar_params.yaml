# Confirmed working parameters for the YDLIDAR X4 Pro on /dev/ydlidar.
# Transcribed verbatim from docs/LiDAR_SLAM_Bringup.md ("read off the
# hardware, not copied from a forum"). Copied by install.sh into
# ~/ros2_ws/src/ydlidar_ros2_driver/params/ydlidar.yaml, overwriting that
# repo's defaults.
#
# NOTE: shown flat, exactly as documented. If your checkout of
# ydlidar_ros2_driver expects these wrapped under a node name (e.g.
# `ydlidar_ros2_driver_node: ros__parameters: ...`), add that wrapper —
# it wasn't specified in the source document, so it isn't guessed here.
port: /dev/ydlidar
baudrate: 128000
lidar_type: 1
device_type: 0
sample_rate: 5
isSingleChannel: true
intensity: false
frequency: 10.0
