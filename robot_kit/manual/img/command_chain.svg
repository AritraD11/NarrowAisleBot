<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Inter, sans-serif" font-size="12">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3a4152"/></marker></defs>
  <rect width="940" height="400" fill="#fff"/>
  <g font-weight="600">
    <rect x="10" y="30" width="130" height="40" rx="7" fill="#eef3fd" stroke="#2f6fdf"/><text x="75" y="55" text-anchor="middle">dashboard / keyboard</text>
    <rect x="10" y="120" width="130" height="40" rx="7" fill="#f3f5f9" stroke="#8b93a5"/><text x="75" y="145" text-anchor="middle">controller_server</text>
    <rect x="10" y="175" width="130" height="40" rx="7" fill="#f3f5f9" stroke="#8b93a5"/><text x="75" y="200" text-anchor="middle">behavior_server</text>
    <rect x="200" y="147" width="130" height="40" rx="7" fill="#f3f5f9" stroke="#8b93a5"/><text x="265" y="172" text-anchor="middle">velocity_smoother</text>
    <rect x="390" y="147" width="130" height="40" rx="7" fill="#fdecea" stroke="#d23b2f"/><text x="455" y="172" text-anchor="middle">collision_monitor</text>
    <rect x="580" y="70" width="110" height="60" rx="7" fill="#eaf7ef" stroke="#1f9d55"/><text x="635" y="96" text-anchor="middle">twist_mux</text><text x="635" y="114" text-anchor="middle" font-weight="400" font-size="10.5" fill="#5a6273">highest live input</text>
    <rect x="750" y="80" width="170" height="40" rx="7" fill="#eef3fd" stroke="#2f6fdf"/><text x="835" y="105" text-anchor="middle">base_controller (kinematics)</text>
    <rect x="750" y="170" width="170" height="40" rx="7" fill="#eef3fd" stroke="#2f6fdf"/><text x="835" y="195" text-anchor="middle">mcu_bridge</text>
    <rect x="750" y="260" width="170" height="40" rx="7" fill="#fdf3ec" stroke="#d9783b"/><text x="835" y="285" text-anchor="middle">MCU: slew, FF + PID, PWM</text>
    <rect x="520" y="260" width="170" height="40" rx="7" fill="#fdf3ec" stroke="#d9783b"/><text x="605" y="285" text-anchor="middle">motors + encoders</text>
    <rect x="290" y="330" width="170" height="40" rx="7" fill="#eef3fd" stroke="#2f6fdf"/><text x="375" y="355" text-anchor="middle">wheel_odometry</text>
    <rect x="40" y="330" width="190" height="40" rx="7" fill="#f3f5f9" stroke="#8b93a5"/><text x="135" y="355" text-anchor="middle">SLAM, Nav2, dashboard</text>
  </g>
  <g fill="none" stroke="#3a4152" stroke-width="1.4">
    <path d="M140,50 L578,88" marker-end="url(#a)"/>
    <path d="M140,140 L198,160" marker-end="url(#a)"/>
    <path d="M140,195 L198,175" marker-end="url(#a)"/>
    <path d="M330,167 L388,167" marker-end="url(#a)"/>
    <path d="M520,160 L578,118" marker-end="url(#a)"/>
    <path d="M690,100 L748,100" marker-end="url(#a)"/>
    <path d="M835,120 L835,168" marker-end="url(#a)"/>
    <path d="M835,210 L835,258" marker-end="url(#a)"/>
    <path d="M750,280 L692,280" marker-end="url(#a)"/>
    <path d="M605,300 C605,320 600,340 462,346" marker-end="url(#a)"/>
    <path d="M290,350 L232,350" marker-end="url(#a)"/>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="10.5" fill="#2f6fdf">
    <text x="330" y="58">/cmd_vel_manual · priority 100</text>
    <text x="150" y="120">/cmd_vel_nav</text>
    <text x="336" y="140">/cmd_vel_smoothed</text>
    <text x="522" y="196">/cmd_vel_nav_out · priority 10</text>
    <text x="694" y="78">/cmd_vel</text>
    <text x="842" y="148">/wheel_cmd</text>
    <text x="828" y="238" text-anchor="end">&lt;V,w0,..&gt; 20 Hz</text>
    <text x="620" y="325">encoder counts → telemetry → /wheel_states</text>
    <text x="236" y="388">/odom + TF</text>
  </g>
  <text x="20" y="20" font-weight="700" font-size="13">Every command reaches the wheels the same way. Three timeouts stack: twist_mux 0.5 s, mcu_bridge 0.5 s, MCU watchdog 0.75 s.</text>
</svg>
