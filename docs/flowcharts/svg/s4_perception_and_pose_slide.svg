<svg xmlns="http://www.w3.org/2000/svg" id="s4" class="fig big" viewBox="0 0 1760 990" width="1760" height="990" role="img" aria-label="Perception and pose: LiDAR through the driver and scan_relay to slam_toolbox and the map, with odometry supplying the odom to base_link transform"><title>Perception and pose: LiDAR through the driver and scan_relay to slam_toolbox and the map, with odometry supplying the odom to base_link transform</title><style>
svg text{font-family:"IBM Plex Sans","Segoe UI",Arial,Helvetica,sans-serif;fill:#172126}
