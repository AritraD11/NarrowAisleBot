<svg xmlns="http://www.w3.org/2000/svg" id="s3" class="fig big" viewBox="0 0 1760 990" width="1760" height="990" role="img" aria-label="Nav2 chain: goal click to goal_pose_adapter and bt_navigator, then planner, controller and behavior servers, then smoother, collision monitor, axis adapter and twist_mux"><title>Nav2 chain: goal click to goal_pose_adapter and bt_navigator, then planner, controller and behavior servers, then smoother, collision monitor, axis adapter and twist_mux</title><style>
svg text{font-family:"IBM Plex Sans","Segoe UI",Arial,Helvetica,sans-serif;fill:#111111}
.band{stroke-width:1.4}
.band-op{fill:#F2F2F2;stroke:#8C8C8C}
.band-pi{fill:#FFFFFF;stroke:#444444}
.band-od{fill:#FFFFFF;stroke:#444444;stroke-dasharray:8 6}
.band-hw{fill:#FFFFFF;stroke:#444444}
.band-pl{fill:#FFFFFF;stroke:#444444}
.bandlbl{font-weight:600;font-size:10.5px;fill:#444444;letter-spacing:.08em}
.bandsub{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-weight:500;font-size:11px;letter-spacing:0;fill:#444444}
.node rect{fill:#FFFFFF;stroke:#111111;stroke-width:1.2}
.node-ext rect{fill:#F2F2F2;stroke:#444444}
.node.dashed rect{stroke-dasharray:4 3}
.node-hwn rect{fill:#E6E6E6;stroke:#111111;stroke-width:1.6}
.node-warnbox rect{fill:#FFFFFF;stroke:#1A1A1A;stroke-width:1.4}
.node-callout rect{fill:#FFFFFF;stroke:#8C8C8C;stroke-dasharray:6 4}
.nt{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-weight:600;font-size:11px}
.node-grp .nt,.node-callout .nt{font-family:"IBM Plex Sans","Segoe UI",Arial,sans-serif}
.ns{font-weight:400;font-size:10.5px;fill:#444444}
.node-grp .ns{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-size:10px}
.note,.note-s{font-size:12px;fill:#444444}.note-s{font-size:10.5px}
.e{fill:none;stroke-width:1.6;stroke-linejoin:round}
.e.thick{stroke-width:2.8}
.e.dash,.e-tf{stroke-dasharray:5 4}
.e-manual{stroke:#1A1A1A}.mk-manual{fill:#1A1A1A}
.e-auto{stroke:#1A1A1A}.mk-auto{fill:#1A1A1A}
.e-merge{stroke:#111111}.mk-merge{fill:#111111}
.e-fb{stroke:#1A1A1A}.mk-fb{fill:#1A1A1A}
.e-scan{stroke:#1A1A1A}.mk-scan{fill:#1A1A1A}
.e-ctl{stroke:#4D4D4D}.mk-ctl{fill:#4D4D4D}
.e-tf{stroke:#6E6E6E}.mk-tf{fill:#6E6E6E}
.e-warn{stroke:#1A1A1A}.mk-warn{fill:#1A1A1A}
.lb{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;font-weight:500;font-size:10px;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.lb-manual{fill:#1A1A1A}.lb-auto{fill:#1A1A1A}.lb-merge{fill:#111111}.lb-fb{fill:#1A1A1A}
.lb-scan{fill:#1A1A1A}.lb-ctl{fill:#4D4D4D}.lb-tf{fill:#555555}.lb-warn{fill:#1A1A1A}
/* slide scale */
.big .band{stroke-width:2}
.big .bandlbl{font-size:21px;letter-spacing:.05em}
.big .bandsub{font-size:21px}
.big .node rect{stroke-width:2.2}
.big .node-hwn rect{stroke-width:2.8}
.big .nt{font-size:24px}
.big .node-grp .nt,.big .node-callout .nt{font-size:26px}
.big .ns{font-size:21px}
.big .node-grp .ns{font-size:21px}
.big .note{font-size:21px}
.big .e{stroke-width:3.2}
.big .e.thick{stroke-width:5.5}
.big .lb{font-size:21px;stroke-width:6px}
.big .legtxt{font-size:21px}
.legtxt{font-size:12px}
.leg{display:none}</style><rect width="1760" height="990" fill="#FFFFFF"/><defs><marker id="a-s3-manual" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-manual"/></marker><marker id="a-s3-auto" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-auto"/></marker><marker id="a-s3-merge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-merge"/></marker><marker id="a-s3-fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-fb"/></marker><marker id="a-s3-scan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-scan"/></marker><marker id="a-s3-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-ctl"/></marker><marker id="a-s3-tf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-tf"/></marker><marker id="a-s3-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,1 L9,5 L0,9 z" class="mk mk-warn"/></marker></defs><path class="e e-ctl" data-c="ctl" d="M105,113 L105,235" marker-end="url(#a-s3-ctl)"/><path class="e e-auto" data-c="auto" d="M105,313 L105,435" marker-end="url(#a-s3-auto)"/><path class="e e-auto" data-c="auto" d="M375,475 L445,475 L445,275 L620,275" marker-end="url(#a-s3-auto)"/><path class="e e-auto" data-c="auto" d="M375,495 L620,495" marker-end="url(#a-s3-auto)"/><path class="e e-auto dash" data-c="auto" d="M375,515 L445,515 L445,725 L620,725" marker-end="url(#a-s3-auto)"/><path class="e e-auto" data-c="auto" d="M1000,475 L1050,475 L1050,75 L1130,75" marker-end="url(#a-s3-auto)"/><path class="e e-auto" data-c="auto" d="M1000,725 L1050,725 L1050,475" marker-end="url(#a-s3-auto)"/><path class="e e-auto" data-c="auto" d="M1210,139 L1210,235" marker-end="url(#a-s3-auto)"/><path class="e e-auto" data-c="auto" d="M1210,339 L1210,435" marker-end="url(#a-s3-auto)"/><path class="e e-auto" data-c="auto" d="M1210,539 L1210,635" marker-end="url(#a-s3-auto)"/><g class="node node-ext"><rect x="35" y="35" width="340" height="78" rx="4"/><text class="nt" x="51" y="69">Goal click</text><text class="ns" x="51" y="99">dashboard map, or Foxglove</text></g><g class="node node-ros"><rect x="35" y="235" width="340" height="78" rx="4"/><text class="nt" x="51" y="269">goal_pose_adapter</text><text class="ns" x="51" y="299">yaw offset 0.0 deg</text></g><g class="node node-ros"><rect x="35" y="435" width="340" height="104" rx="4"/><text class="nt" x="51" y="469">bt_navigator</text><text class="ns" x="51" y="499">replanning and recovery</text><text class="ns" x="51" y="525">behavior tree</text></g><g class="node node-ros"><rect x="620" y="235" width="380" height="104" rx="4"/><text class="nt" x="636" y="269">planner_server</text><text class="ns" x="636" y="299">NavFn, A*, global costmap</text><text class="ns" x="636" y="325">reads /map</text></g><g class="node node-ros"><rect x="620" y="435" width="380" height="130" rx="4"/><text class="nt" x="636" y="469">controller_server</text><text class="ns" x="636" y="499">MPPI, Omni, local costmap</text><text class="ns" x="636" y="525">reads /scan_reliable,</text><text class="ns" x="636" y="551">/wheel_odom</text></g><g class="node node-ros"><rect x="620" y="685" width="380" height="104" rx="4"/><text class="nt" x="636" y="719">behavior_server</text><text class="ns" x="636" y="749">Spin, BackUp, Wait</text><text class="ns" x="636" y="775">BackUp strafes left here</text></g><g class="node node-ros"><rect x="1130" y="35" width="340" height="104" rx="4"/><text class="nt" x="1146" y="69">velocity_smoother</text><text class="ns" x="1146" y="99">0.12 m/s, 0.30 rad/s caps</text><text class="ns" x="1146" y="125">reads /wheel_odom</text></g><g class="node node-ros"><rect x="1130" y="235" width="340" height="104" rx="4"/><text class="nt" x="1146" y="269">collision_monitor</text><text class="ns" x="1146" y="299">approach polygon, 1.2 s</text><text class="ns" x="1146" y="325">reads /scan_reliable</text></g><g class="node node-ros"><rect x="1130" y="435" width="340" height="104" rx="4"/><text class="nt" x="1146" y="469">cmd_vel_axis_adapter</text><text class="ns" x="1146" y="499">out.x = in.y</text><text class="ns" x="1146" y="525">out.y = -in.x</text></g><g class="node node-ros"><rect x="1130" y="635" width="340" height="104" rx="4"/><text class="nt" x="1146" y="669">twist_mux</text><text class="ns" x="1146" y="699">nav priority 10,</text><text class="ns" x="1146" y="725">manual 100 wins</text></g><g class="node node-callout"><rect x="35" y="770" width="545" height="130" rx="4"/><text class="nt" x="51" y="804">Inputs from the rest of the robot</text><text class="ns" x="51" y="834">/map from slam_toolbox</text><text class="ns" x="51" y="860">/scan_reliable from scan_relay</text><text class="ns" x="51" y="886">/wheel_odom, TF from odometry_publisher</text></g><g class="node node-callout"><rect x="1130" y="770" width="590" height="130" rx="4"/><text class="nt" x="1146" y="804">Why the axis adapter is last</text><text class="ns" x="1146" y="834">Everything before it works in base_link axes</text><text class="ns" x="1146" y="860">(+X right, +Y forward). The wheel kinematics</text><text class="ns" x="1146" y="886">use REP-103, so the adapter rotates the command.</text></g><g class="node node-callout"><rect x="620" y="830" width="380" height="104" rx="4"/><text class="nt" x="636" y="864">Not started on purpose</text><text class="ns" x="636" y="894">route_server, opennav_docking,</text><text class="ns" x="636" y="920">robot_localization (no IMU)</text></g><text class="lb lb-ctl" data-c="ctl" x="119" y="215" text-anchor="start">/goal_pose_click</text><text class="lb lb-auto" data-c="auto" x="119" y="415" text-anchor="start">/goal_pose</text><text class="lb lb-auto" data-c="auto" x="459" y="255" text-anchor="start">plan</text><text class="lb lb-auto" data-c="auto" x="540" y="483" text-anchor="middle">follow_path</text><text class="lb lb-auto" data-c="auto" x="459" y="705" text-anchor="start">recoveries</text><text class="lb lb-auto" data-c="auto" x="1036" y="395" text-anchor="end">/cmd_vel_nav</text><text class="lb lb-auto" data-c="auto" x="1224" y="215" text-anchor="start">/cmd_vel_smoothed</text><text class="lb lb-auto" data-c="auto" x="1224" y="415" text-anchor="start">/cmd_vel_baselink</text><text class="lb lb-auto" data-c="auto" x="1224" y="615" text-anchor="start">/cmd_vel_nav_out</text></svg>