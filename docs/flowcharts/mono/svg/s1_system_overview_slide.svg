fb)"/><path class="e e-scan leg" data-c="scan" d="M1435,810 L1505,810" marker-end="url(#a-s1-scan)"/><path class="e e-ctl leg" data-c="ctl" d="M1435,848 L1505,848" marker-end="url(#a-s1-ctl)"/><path class="e e-tf dash leg" data-c="tf" d="M1435,886 L1505,886" marker-end="url(#a-s1-tf)"/><g class="node node-ext"><rect x="625" y="35" width="330" height="78" rx="4"/><text class="nt" x="641" y="69">Phone browser</text><text class="ns" x="641" y="99">Wi-Fi AP, WebSocket</text></g><g class="node node-ext"><rect x="325" y="35" width="230" height="78" rx="4"/><text class="nt" x="341" y="69">Foxglove</text><text class="ns" x="341" y="99">laptop, debug only</text></g><g class="node node-grp"><rect x="625" y="235" width="330" height="165" rx="4"/><text class="nt" x="641" y="269">Operator interface</text><text class="ns" x="641" y="299">phone_dashboard</text><text class="ns" x="641" y="325">foxglove_bridge</text></g><g class="node node-grp"><rect x="1025" y="235" width="330" height="165" rx="4"/><text class="nt" x="1041" y="269">Drive and odometry</text><text class="ns" x="1041" y="299">twist_mux, teleop_asym</text><text class="ns" x="1041" y="325">esp32_bridge</text><text class="ns" x="1041" y="351">odometry_publisher</text></g><g class="node node-grp"><rect x="325" y="235" width="230" height="120" rx="4"/><text class="nt" x="341" y="269">Arm</text><text class="ns" x="341" y="299">arm_bridge</text></g><g class="node node-hwn"><rect x="35" y="235" width="220" height="120" rx="4"/><text class="nt" x="51" y="269">Arduino Mega</text><text class="ns" x="51" y="299">arm, lift, 3 UV</text></g><g class="node node-hwn"><rect x="1425" y="235" width="300" height="165" rx="4"/><text class="nt" x="1441" y="269">ESP32</text><text class="ns" x="1441" y="299">100 Hz PID,</text><text class="ns" x="1441" y="325">latching E-STOP</text></g><g class="node node-grp"><rect x="625" y="520" width="330" height="165" rx="4"/><text class="nt" x="641" y="554">LiDAR and mapping</text><text class="ns" x="641" y="584">ydlidar driver</text><text class="ns" x="641" y="610">scan_relay</text><text class="ns" x="641" y="636">slam_toolbox</text></g><g class="node node-grp"><rect x="1025" y="520" width="330" height="165" rx="4"/><text class="nt" x="1041" y="554">Navigation (Nav2)</text><text class="ns" x="1041" y="584">planner, MPPI controller</text><text class="ns" x="1041" y="610">velocity_smoother</text><text class="ns" x="1041" y="636">collision_monitor</text></g><g class="node node-hwn"><rect x="1425" y="520" width="300" height="120" rx="4"/><text class="nt" x="1441" y="554">4 wheels</text><text class="ns" x="1441" y="584">mecanum, encoders</text></g><g class="node node-hwn"><rect x="625" y="805" width="330" height="78" rx="4"/><text class="nt" x="641" y="839">YDLIDAR X4 Pro</text><text class="ns" x="641" y="869">USB, 128000 baud</text></g><text class="legtxt leg" x="1123" y="817">Manual drive command</text><text class="legtxt leg" x="1123" y="855">Autonomous drive command</text><text class="legtxt leg" x="1123" y="893">Command to the wheels</text><text class="legtxt leg" x="1123" y="931">Feedback, odometry</text><text class="legtxt leg" x="1523" y="817">LiDAR and map</text><text class="legtxt leg" x="1523" y="855">Operator, control</text><text class="legtxt leg" x="1523" y="893">TF</text></svg>